syntax = "proto3";
package spike.v1;

service Echo {
  // Q2: unary round-trip
  rpc UnaryEcho(EchoRequest) returns (EchoResponse);
  // Q3: server-streaming (mirrors Star's progress stream)
  rpc StreamEcho(EchoRequest) returns (stream EchoResponse);
}

message EchoRequest  { string message = 1; int32 count = 2; }
message EchoResponse { string message = 1; int32 index = 2; }

// Q7: length-framed protobuf over stdio (NIO-free transport validation)
message Envelope {
  uint64 id = 1;
  enum Kind {
    REQUEST      = 0;
    RESPONSE     = 1;
    ERROR        = 2;
    STREAM_ITEM  = 3;
    STREAM_END   = 4;
    NOTIFICATION = 5;
  }
  Kind   kind    = 2;
  string method  = 3;   // "echo" | "stream" | "shutdown"
  bytes  payload = 4;   // serialized EchoRequest / EchoResponse
  string error   = 5;
}
